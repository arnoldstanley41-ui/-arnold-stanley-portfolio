[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=0, must-revalidate"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[redirects]]
  from = "/education/*"
  to = "/#education"
  status = 301

[[redirects]]
  from = "/experience/*"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/publications/*"
  to = "/#publications"
  status = 301

[[redirects]]
  from = "/recognition/*"
  to = "/#recognition"
  status = 301

[[redirects]]
  from = "/research/*"
  to = "/#speaking"
  status = 301
