[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/education/*"
  to = "/#education"
  status = 301

[[redirects]]
  from = "/experience/*"
  to = "/#experience"
  status = 301

[[redirects]]
  from = "/publications/*"
  to = "/#publications"
  status = 301

[[redirects]]
  from = "/recognition/*"
  to = "/#recognition"
  status = 301

[[redirects]]
  from = "/research/*"
  to = "/#speaking"
  status = 301
